<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc" font-family="ui-serif, Georgia, 'Iowan Old Style', serif">
  <title id="arch-title">Iterum system architecture</title>
  <desc id="arch-desc">Layered architecture showing SwiftUI presentation, services, SwiftData models, and a parallel widget extension process sharing storage via an App Group container.</desc>
  <defs>
    <style>
      .bg     { fill: #FAF7F2; }
      .card   { fill: #FFFFFF; stroke: #E5DCC9; stroke-width: 1; }
      .layer  { fill: #FFFFFF; stroke: #E5DCC9; stroke-width: 1; }
      .accent { fill: #7A5A3F; }
      .accentSoft { fill: #F1E6D8; stroke: #D9C4A5; stroke-width: 1; }
      .navy   { fill: #2C3F5C; }
      .navySoft { fill: #E4EAF2; stroke: #B9C5D6; stroke-width: 1; }
      .ink    { fill: #2A2520; }
      .muted  { fill: #8B7E6D; }
      .edge   { stroke: #C9BBA4; stroke-width: 1.2; fill: none; }
      .dash   { stroke: #C9BBA4; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
      .h      { font-family: ui-serif, Georgia, serif; font-weight: 700; }
      .t      { font-family: ui-sans-serif, -apple-system, 'Helvetica Neue', sans-serif; font-size: 11px; }
      .lbl    { font-family: ui-sans-serif, -apple-system, sans-serif; font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; }
    </style>
    <marker id="dasharrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C9BBA4"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="600"/>
  <text class="lbl muted" x="36" y="76">Presentation</text>
  <text class="lbl muted" x="36" y="216">Services</text>
  <text class="lbl muted" x="36" y="356">Domain models</text>
  <text class="lbl muted" x="36" y="496">Foundation</text>
  <rect class="layer" x="170" y="50" width="560" height="100" rx="8"/>
  <text class="h ink" x="186" y="74" font-size="14">SwiftUI views</text>
  <g font-size="12" class="ink">
    <rect class="accentSoft" x="186" y="86" width="70" height="22" rx="4"/>
    <text x="221" y="101" text-anchor="middle">Today</text>
    <rect class="accentSoft" x="262" y="86" width="70" height="22" rx="4"/>
    <text x="297" y="101" text-anchor="middle">Journal</text>
    <rect class="accentSoft" x="338" y="86" width="70" height="22" rx="4"/>
    <text x="373" y="101" text-anchor="middle">Calendar</text>
    <rect class="accentSoft" x="414" y="86" width="70" height="22" rx="4"/>
    <text x="449" y="101" text-anchor="middle">Map</text>
    <rect class="accentSoft" x="490" y="86" width="70" height="22" rx="4"/>
    <text x="525" y="101" text-anchor="middle">Editor</text>
    <rect class="accentSoft" x="566" y="86" width="70" height="22" rx="4"/>
    <text x="601" y="101" text-anchor="middle">Settings</text>
    <rect class="accentSoft" x="642" y="86" width="70" height="22" rx="4"/>
    <text x="677" y="101" text-anchor="middle">Onboarding</text>
  </g>
  <text class="t muted" x="186" y="132">SwiftUI · UIKit-bridged rich text · @Observable + @Bindable</text>
  <rect class="layer" x="170" y="190" width="560" height="100" rx="8"/>
  <text class="h ink" x="186" y="214" font-size="14">Services &amp; coordinators</text>
  <g font-size="12" class="ink">
    <rect class="navySoft" x="186" y="226" width="118" height="22" rx="4"/>
    <text x="245" y="241" text-anchor="middle">AppBootstrap</text>
    <rect class="navySoft" x="310" y="226" width="128" height="22" rx="4"/>
    <text x="374" y="241" text-anchor="middle">SyncStatusMonitor</text>
    <rect class="navySoft" x="444" y="226" width="118" height="22" rx="4"/>
    <text x="503" y="241" text-anchor="middle">WeatherService</text>
    <rect class="navySoft" x="568" y="226" width="146" height="22" rx="4"/>
    <text x="641" y="241" text-anchor="middle">LocationGeocoder</text>
    <rect class="navySoft" x="186" y="254" width="118" height="22" rx="4"/>
    <text x="245" y="269" text-anchor="middle">TagDeduper</text>
    <rect class="navySoft" x="310" y="254" width="128" height="22" rx="4"/>
    <text x="374" y="269" text-anchor="middle">PhotoImageCache</text>
    <rect class="navySoft" x="444" y="254" width="118" height="22" rx="4"/>
    <text x="503" y="269" text-anchor="middle">IntentStore</text>
    <rect class="navySoft" x="568" y="254" width="146" height="22" rx="4"/>
    <text x="641" y="269" text-anchor="middle">ICloudAccountMonitor</text>
  </g>
  <rect class="layer" x="170" y="330" width="560" height="100" rx="8"/>
  <text class="h ink" x="186" y="354" font-size="14">SwiftData domain models</text>
  <g font-size="12" class="ink">
    <rect class="accentSoft" x="186" y="366" width="120" height="22" rx="4"/>
    <text x="246" y="381" text-anchor="middle">JournalEntry</text>
    <rect class="accentSoft" x="312" y="366" width="100" height="22" rx="4"/>
    <text x="362" y="381" text-anchor="middle">EntryPhoto</text>
    <rect class="accentSoft" x="418" y="366" width="92" height="22" rx="4"/>
    <text x="464" y="381" text-anchor="middle">EntryTag</text>
    <rect class="accentSoft" x="516" y="366" width="80" height="22" rx="4"/>
    <text x="556" y="381" text-anchor="middle">Tracker</text>
    <rect class="accentSoft" x="602" y="366" width="112" height="22" rx="4"/>
    <text x="658" y="381" text-anchor="middle">TrackerEntry</text>
    <rect class="accentSoft" x="186" y="394" width="120" height="22" rx="4"/>
    <text x="246" y="409" text-anchor="middle">AppSettings</text>
  </g>
  <rect class="layer" x="170" y="470" width="560" height="100" rx="8"/>
  <text class="h ink" x="186" y="494" font-size="14">Persistence &amp; system frameworks</text>
  <g font-size="12" class="ink">
    <rect class="card" x="186" y="506" width="180" height="42" rx="4" stroke="#7A5A3F" stroke-width="1.2"/>
    <text x="276" y="525" text-anchor="middle" class="h">SharedStore</text>
    <text x="276" y="540" text-anchor="middle" class="t muted">App Group container</text>
    <rect class="card" x="376" y="506" width="160" height="42" rx="4" stroke="#2C3F5C" stroke-width="1.2"/>
    <text x="456" y="525" text-anchor="middle" class="h">CloudKit</text>
    <text x="456" y="540" text-anchor="middle" class="t muted">Private database</text>
    <rect class="card" x="546" y="506" width="168" height="42" rx="4" stroke="#8B7E6D" stroke-width="1.2"/>
    <text x="630" y="525" text-anchor="middle" class="h">Apple frameworks</text>
    <text x="630" y="540" text-anchor="middle" class="t muted">WeatherKit · MapKit · PhotosUI</text>
  </g>
  <rect class="card" x="760" y="50" width="170" height="240" rx="8" stroke="#7A5A3F" stroke-dasharray="3 3"/>
  <text class="lbl accent" x="775" y="76">Widget extension</text>
  <text class="h ink" x="775" y="98" font-size="14">IterumWidgets</text>
  <rect class="accentSoft" x="775" y="112" width="140" height="22" rx="4"/>
  <text x="845" y="127" text-anchor="middle" font-size="12">TrackerMonthWidget</text>
  <rect class="accentSoft" x="775" y="140" width="140" height="22" rx="4"/>
  <text x="845" y="155" text-anchor="middle" font-size="12">SelectTrackerIntent</text>
  <rect class="accentSoft" x="775" y="168" width="140" height="22" rx="4"/>
  <text x="845" y="183" text-anchor="middle" font-size="12">ToggleBooleanIntent</text>
  <text class="t muted" x="775" y="212">Separate process. Reads the</text>
  <text class="t muted" x="775" y="226">same store via the App Group.</text>
  <text class="t muted" x="775" y="240">Interactive intents toggle</text>
  <text class="t muted" x="775" y="254">tracker values without</text>
  <text class="t muted" x="775" y="268">opening the host app.</text>
  <path class="edge" d="M 450 150 L 450 190"/>
  <path class="edge" d="M 450 290 L 450 330"/>
  <path class="edge" d="M 450 430 L 450 470"/>
  <path class="dash" d="M 845 290 L 845 570 Q 845 580 835 580 L 286 580 Q 276 580 276 570 L 276 548" marker-end="url(#dasharrow)"/>
  <text class="t muted" x="560" y="574" text-anchor="middle">shared on-disk store</text>
</svg>
